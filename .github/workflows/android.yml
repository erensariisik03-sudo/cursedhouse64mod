name: Build Android .so (ARM64)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Test UTF-8 editor
        run: bash tests/run.sh

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist/arm64-v8a
          cp build/libmultiplayermod.so dist/arm64-v8a/libmultiplayermod.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded dist/arm64-v8a/libmultiplayermod.so
          file dist/arm64-v8a/libmultiplayermod.so
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d dist/arm64-v8a/libmultiplayermod.so

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: multiplayermod-arm64-v8a
          path: dist/arm64-v8a/libmultiplayermod.so
          if-no-files-found: error
          # Keep storage usage low to avoid hitting the account artifact quota.
          retention-days: 3
          compression-level: 9
